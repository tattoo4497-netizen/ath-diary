<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATH日めくり記録帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .table-header { background-color: #1e293b; position: sticky; top: 0; z-index: 10; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-20 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold text-cyan-400">📊 ATH日めくり記録帳</h1>
            <div class="flex items-center space-x-2">
                <button onclick="manualRefresh()" id="refresh-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 transition flex items-center space-x-1">
                    <span>🔄 更新</span>
                </button>
                <button onclick="goToToday()" class="bg-cyan-600 hover:bg-cyan-500 text-xs px-3 py-1.5 rounded font-medium transition">
                    今日
                </button>
            </div>
        </div>
    </header>

    <!-- 日付コントロールバー -->
    <div class="bg-slate-900/80 backdrop-blur border-b border-slate-800 py-2 px-4 sticky top-[49px] z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <button onclick="changeDate(-1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 font-medium flex items-center space-x-1">
                <span>◀ 前日</span>
            </button>
            <div class="text-center">
                <span id="current-date-display" class="text-sm font-bold tracking-wide text-slate-100">----/--/--</span>
                <div class="text-[10px] text-slate-400 flex justify-center space-x-2">
                    <span id="record-count">記録銘柄: 0 件</span>
                    <span id="last-updated-time">最終更新: --:--</span>
                </div>
            </div>
            <button onclick="changeDate(1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 font-medium flex items-center space-x-1">
                <span>翌日 ▶</span>
            </button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-2 pb-12">
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="table-header text-slate-400 border-b border-slate-800 text-[11px]">
                            <th class="p-2.5 font-medium">コード</th>
                            <th class="p-2.5 font-medium">銘柄名</th>
                            <th class="p-2.5 font-medium text-center">連続日数</th>
                            <th class="p-2.5 font-medium text-right">株価</th>
                            <th class="p-2.5 font-medium text-right">前日比</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-500">データを読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let currentDate = new Date().toISOString().split('T')[0];

        // 日付変更ボタン
        function changeDate(days) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + days);
            currentDate = d.toISOString().split('T')[0];
            loadData(currentDate);
        }

        function goToToday() {
            currentDate = new Date().toISOString().split('T')[0];
            loadData(currentDate);
        }

        // 手動更新（最新のath_data.jsonを強制取得して今日の日付に反映）
        function manualRefresh() {
            goToToday();
        }

        // データのロード（キャッシュを残さない設定: cache: 'no-store'）
        async function loadData(dateStr) {
            document.getElementById('current-date-display').innerText = dateStr;
            const todayStr = new Date().toISOString().split('T')[0];
            
            // 本日の場合はルートの ath_data.json、過去日の場合は history/YYYY-MM-DD.json を読み込む
            let fileUrl = (dateStr === todayStr) ? 'ath_data.json' : `history/${dateStr}.json`;

            try {
                const response = await fetch(fileUrl + '?t=' + new Date().getTime(), { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error("データがありません");
                }
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                document.getElementById('stock-table-body').innerHTML = `
                    <tr><td colspan="5" class="text-center py-12 text-slate-500">
                        ${dateStr} の記録はありません
                    </td></tr>`;
                document.getElementById('record-count').innerText = "記録銘柄: 0 件";
                document.getElementById('last-updated-time').innerText = "最終更新: --:--";
            }
        }

        // テーブルの描画
        function renderTable(data) {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';

            const stocks = data.stocks || {};
            const stockKeys = Object.keys(stocks);

            document.getElementById('record-count').innerText = `記録銘柄: ${stockKeys.length} 件`;
            document.getElementById('last-updated-time').innerText = `最終更新: ${data.last_updated_time || '--:--'}`;

            if (stockKeys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-500">該当する銘柄はありません</td></tr>`;
                return;
            }

            // 前日比の高い順にソート
            const sortedKeys = stockKeys.sort((a, b) => stocks[b].change - stocks[a].change);

            sortedKeys.forEach(code => {
                const s = stocks[code];
                const changeClass = s.change >= 0 ? 'text-red-400 font-medium' : 'text-blue-400 font-medium';
                const changeSign = s.change > 0 ? '+' : '';
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition';
                tr.innerHTML = `
                    <td class="p-2.5 font-mono text-slate-300 font-semibold">${code}</td>
                    <td class="p-2.5 font-medium text-slate-100 max-w-[140px] truncate" title="${s.name}">${s.name}</td>
                    <td class="p-2.5 text-center">
                        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            ${s.consecutive_days || 1}日連続 🔥
                        </span>
                    </td>
                    <td class="p-2.5 text-right font-mono text-slate-200">¥${s.price.toLocaleString()}</td>
                    <td class="p-2.5 text-right font-mono ${changeClass}">${changeSign}${s.change}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初期ロード
        loadData(currentDate);
    </script>
</body>
</html>
